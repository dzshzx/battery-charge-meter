name: Windows validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (Python from .python-version)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Check locks
        run: |
          uv lock --check
          uv lock --check --script scripts/make-icon.py

      - name: Install Pester (test scripts need 5.x in both PowerShell editions)
        shell: pwsh
        run: Save-PSResource -Name Pester -Version 5.9.1 -Repository PSGallery -TrustRepository -Path "$env:ProgramFiles\WindowsPowerShell\Modules"

      - name: Test application and Release packages
        shell: pwsh
        run: ./scripts/test.ps1 -RequireInstaller

      - name: Check NuGet dependency licenses (SPDX allowlist)
        shell: pwsh
        run: ./scripts/check-licenses.ps1

      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-report
          path: |
            dist/test-report.json
            dist/ui-preview/
          if-no-files-found: warn

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (Python from .python-version)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Check formatting (ruff, prettier, shfmt)
        run: bash scripts/format.sh --check
