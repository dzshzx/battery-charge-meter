name: CI

on:
  push:
    branches:
      - master
      - "candidate/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (Python from .python-version)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.19"

      - name: Check locks
        run: |
          uv lock --check
          uv lock --check --script scripts/make-icon.py

      - name: Install Pester (test scripts need 5.x in both PowerShell editions)
        shell: pwsh
        run: Save-PSResource -Name Pester -Version 5.9.1 -Repository PSGallery -TrustRepository -Path "$env:ProgramFiles\WindowsPowerShell\Modules"

      - name: Test application and Release packages
        shell: pwsh
        run: ./scripts/test.ps1 -RequireInstaller

      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-report
          path: |
            dist/test-report.json
            dist/ui-preview/
          if-no-files-found: warn

  format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (Python from .python-version)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.19"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check formatting (ruff, prettier, shfmt)
        run: bash scripts/format.sh --check

  # The master ruleset requires this one check on every pushed SHA. It runs even
  # when a needed job fails or is skipped, and succeeds only if every needed job
  # succeeded, so adding or renaming jobs never touches the ruleset.
  ci-ok:
    if: always()
    needs: [build, format]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf '%s\n' "$NEEDS"
          [ -n "$RESULTS" ] || exit 1
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a needed job concluded $result"; exit 1; }
          done
