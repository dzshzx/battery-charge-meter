name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate immutable release identity
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tag must use vX.Y.Z format: $tag"
          }

          $version = $Matches.version
          [xml]$manifest = Get-Content -LiteralPath 'src/BatteryChargeMeter.manifest'
          $manifestVersion = $manifest.assembly.assemblyIdentity.version
          $expectedManifestVersion = "$version.0"

          if ($manifestVersion -ne $expectedManifestVersion) {
              throw "Tag $tag requires manifest version $expectedManifestVersion; found $manifestVersion."
          }

          & python scripts/version_plan.py verify `
            --repository dzshzx/battery-charge-meter `
            --target "v=$version" `
            --tag-ref "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
              throw "Release tag $tag failed version authorization validation."
          }

          $tagRef = "refs/tags/$tag"
          $tagObjectType = (git cat-file -t $tagRef).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagObjectType -ne 'tag') {
              throw "Release tag must be annotated: $tag"
          }

          $tagCommit = (git rev-list -n1 $tagRef).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw "Release tag $tag does not resolve to workflow SHA $env:GITHUB_SHA."
          }

          git fetch --no-tags origin +master:refs/remotes/origin/master
          if ($LASTEXITCODE -ne 0) {
              throw 'Could not fetch origin/master for release ancestry validation.'
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) {
              throw "Release SHA $env:GITHUB_SHA is not on origin/master."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Test application and Release packages
        shell: pwsh
        run: ./scripts/test.ps1 -RequireInstaller

      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-report
          path: dist/test-report.json
          if-no-files-found: warn

      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $package = ./scripts/package-release.ps1 `
            -Tag $tag `
            -ExecutablePath 'dist/PowerMeter.exe' `
            -OutputDirectory $env:RUNNER_TEMP `
            -Formats 'Portable', 'Installer'

          "binary=$($package.BinaryPath)" >> $env:GITHUB_OUTPUT
          "checksum=$($package.ChecksumPath)" >> $env:GITHUB_OUTPUT
          "installer=$($package.InstallerPath)" >> $env:GITHUB_OUTPUT
          "installer_checksum=$($package.InstallerChecksumPath)" >> $env:GITHUB_OUTPUT
          "notices=$($package.NoticesPath)" >> $env:GITHUB_OUTPUT
          "source_bundle=$($package.SourceBundlePath)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' `
            '${{ steps.package.outputs.binary }}#Portable Windows executable' `
            '${{ steps.package.outputs.checksum }}#SHA-256 checksum' `
            '${{ steps.package.outputs.installer }}#Windows installer' `
            '${{ steps.package.outputs.installer_checksum }}#Installer SHA-256 checksum' `
            '${{ steps.package.outputs.notices }}#Third-party notices and licenses' `
            '${{ steps.package.outputs.source_bundle }}#Corresponding PawnIO.Modules source' `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --generate-notes `
            --title '${{ steps.version.outputs.tag }}'
