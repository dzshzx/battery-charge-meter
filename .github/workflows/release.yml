name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv (Python from .python-version)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.21"

      - name: Validate immutable release identity
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Release tag must use vX.Y.Z format: $tag"
          }

          $version = $Matches.version
          [xml]$manifest = Get-Content -LiteralPath 'src/BatteryChargeMeter.manifest'
          $manifestVersion = $manifest.assembly.assemblyIdentity.version
          $expectedManifestVersion = "$version.0"

          if ($manifestVersion -ne $expectedManifestVersion) {
              throw "Tag $tag requires manifest version $expectedManifestVersion; found $manifestVersion."
          }

          $planSha = '75bf5ca95a191bd97df2500521bcb7aad6136e7c'
          $planDir = Join-Path ([IO.Path]::GetTempPath()) "version-plan-$planSha"
          New-Item -ItemType Directory -Force -Path $planDir | Out-Null
          foreach ($name in 'version_plan.py', 'version_plan.py.lock') {
              Invoke-WebRequest -UseBasicParsing -OutFile (Join-Path $planDir $name) `
                -Uri "https://raw.githubusercontent.com/dzshzx/agent-skills/$planSha/scripts/$name"
          }
          & uv run --script --locked (Join-Path $planDir 'version_plan.py') verify `
            --repository dzshzx/power-meter `
            --target "v=$version" `
            --tag-ref "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
              throw "Release tag $tag failed version plan validation."
          }

          $tagRef = "refs/tags/$tag"
          $tagObjectType = (git cat-file -t $tagRef).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagObjectType -ne 'tag') {
              throw "Release tag must be annotated: $tag"
          }

          $tagCommit = (git rev-list -n1 $tagRef).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw "Release tag $tag does not resolve to workflow SHA $env:GITHUB_SHA."
          }

          git fetch --no-tags origin +master:refs/remotes/origin/master
          if ($LASTEXITCODE -ne 0) {
              throw 'Could not fetch origin/master for release ancestry validation.'
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) {
              throw "Release SHA $env:GITHUB_SHA is not on origin/master."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Pester (test scripts need 5.x in both PowerShell editions)
        shell: pwsh
        run: Save-PSResource -Name Pester -Version 5.9.1 -Repository PSGallery -TrustRepository -Path "$env:ProgramFiles\WindowsPowerShell\Modules"

      - name: Test application and Release packages
        shell: pwsh
        run: ./scripts/test.ps1 -RequireInstaller

      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-report
          path: |
            dist/test-report.json
            dist/ui-preview/
          if-no-files-found: warn

      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $package = ./scripts/package-release.ps1 `
            -Tag $tag `
            -ExecutablePath 'dist/PowerMeter.exe' `
            -OutputDirectory $env:RUNNER_TEMP `
            -Formats 'Portable', 'Installer'

          "binary=$($package.BinaryPath)" >> $env:GITHUB_OUTPUT
          "checksum=$($package.ChecksumPath)" >> $env:GITHUB_OUTPUT
          "installer=$($package.InstallerPath)" >> $env:GITHUB_OUTPUT
          "installer_checksum=$($package.InstallerChecksumPath)" >> $env:GITHUB_OUTPUT
          "notices=$($package.NoticesPath)" >> $env:GITHUB_OUTPUT
          "source_bundle=$($package.SourceBundlePath)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' `
            '${{ steps.package.outputs.binary }}#Portable Windows executable' `
            '${{ steps.package.outputs.checksum }}#SHA-256 checksum' `
            '${{ steps.package.outputs.installer }}#Windows installer' `
            '${{ steps.package.outputs.installer_checksum }}#Installer SHA-256 checksum' `
            '${{ steps.package.outputs.notices }}#Third-party notices and licenses' `
            '${{ steps.package.outputs.source_bundle }}#Corresponding PawnIO.Modules source' `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --generate-notes `
            --title '${{ steps.version.outputs.tag }}'
